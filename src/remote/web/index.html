  <div id="app">
    <header class="topbar" id="topbar">
      <button class="icon-btn topbar-back" id="topbar-back" type="button" aria-label="Back" hidden>
        <svg class="icon"><use href="#i-arrow-left"/></svg>
      </button>
      <h1 class="topbar-title" id="topbar-title">Home</h1>
      <div class="link-state" id="link-state" role="status" aria-live="polite">
        <span class="link-dot"></span><span class="link-text" id="link-text">Connecting</span>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <div class="dock">
      <div class="mini" id="mini" hidden>
        <span class="mini-progress"><span class="mini-progress-fill" id="mini-fill"></span></span>
        <button class="mini-open" id="mini-open" type="button" aria-label="Open now playing">
          <span class="mini-art" id="mini-art"></span>
          <span class="mini-text">
            <span class="mini-title" id="mini-title"></span>
            <span class="mini-sub" id="mini-sub"></span>
          </span>
        </button>
        <button class="icon-btn mini-toggle" id="mini-toggle" type="button" aria-label="Pause">
          <svg class="icon"><use href="#i-pause"/></svg>
        </button>
      </div>

      <nav class="tabs" aria-label="Sections">
        <button class="tab" type="button" data-tab="home"><svg class="icon"><use href="#i-home"/></svg><span>Home</span></button>
        <button class="tab" type="button" data-tab="libraries"><svg class="icon"><use href="#i-library"/></svg><span>Library</span></button>
        <button class="tab" type="button" data-tab="search"><svg class="icon"><use href="#i-search"/></svg><span>Search</span></button>
        <button class="tab" type="button" data-tab="remote"><svg class="icon"><use href="#i-remote"/></svg><span>Remote</span></button>
      </nav>
    </div>

    <section class="player" id="player" aria-label="Now playing" tabindex="-1" hidden></section>
    <div class="sheet-layer" id="sheet-layer"></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <div class="pin" id="pin" hidden>
      <form class="pin-card" id="pin-form" autocomplete="off">
        <svg class="icon pin-icon"><use href="#i-lock"/></svg>
        <h2>Enter the PIN</h2>
        <p>The PIN is shown on the TV under Settings, Web remote.</p>
        <input id="pin-input" class="pin-input" inputmode="numeric" pattern="[0-9]*" maxlength="8" aria-label="PIN" autocomplete="one-time-code">
        <p class="pin-error" id="pin-error" role="alert"></p>
        <button class="btn btn-primary" type="submit">Connect</button>
      </form>
    </div>
  </div>
</body>
</html>
