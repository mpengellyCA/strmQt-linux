name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    # Arch, because Qt 6.11 and mpv 0.41 are what this targets and Ubuntu's
    # runners ship neither. The container gives the same toolchain the project
    # is developed against.
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      - name: Install dependencies
        # The VLC packages are the ones the PKGBUILD declares, not the `vlc`
        # metapackage — the same correction release.yml already carries, which
        # this file never got. Arch's `vlc` depends on bash, an icon theme and
        # the Qt GUI; every codec is an OPTIONAL dependency pacman does not
        # install. That leaves libvlc able to demux the test clip and display
        # it through vmem with nothing able to DECODE it, so tst_vlc_player
        # waited out its 15 s timeout on a frame that could never arrive.
        # Reproduced in this exact container: installing vlc-plugin-ffmpeg
        # alone turns the failure into a pass in 0.3 s.
        run: |
          pacman -Syu --noconfirm --needed \
            git cmake ninja pkgconf gcc ffmpeg \
            qt6-base qt6-declarative qt6-websockets qt6-tools qt6-svg \
            mpv sdl3 \
            libvlc vlc-plugins-base vlc-plugin-ffmpeg \
            xorg-server-xvfb

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --test-dir build/release --output-on-failure

      # qmllint exits 0 even on warnings. Compare every normalized warning to
      # the reviewed baseline so warning noise cannot conceal a regression.
      - name: QML lint warning baseline
        run: bash scripts/check-qmllint-baseline.sh build/release

      # A plain offscreen run only ever constructs StackView's initialItem, so
      # it proves nothing about pages reached by a push. This constructs every
      # page and exits non-zero if any fails.
      - name: Page-construction self-test
        env:
          STRMQT_SELFTEST: "1"
          QT_QPA_PLATFORM: offscreen
          QT_ASSUME_STDERR_HAS_CONSOLE: "1"
        run: ./build/release/strmqt

      - name: Install layer is sane
        run: |
          DESTDIR=/tmp/stage cmake --install build/release
          find /tmp/stage -type f | sort
          # The QML module is compiled into the executable; shipping loose QML
          # or a static library would mean the install rules drifted.
          if find /tmp/stage \( -name '*.qml' -o -name qmldir -o -name '*.a' \) | grep -q .; then
            echo "::error::unexpected files in the install tree"
            exit 1
          fi
