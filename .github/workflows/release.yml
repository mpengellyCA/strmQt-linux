name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.3.0)'
        required: true

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve release revision
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      ref: ${{ steps.validate.outputs.ref }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Validate release tag
        id: validate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_REF: ${{ github.ref }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$DISPATCH_TAG"
          else
            [[ "$PUSH_REF" == refs/tags/* ]] || {
              echo "::error::release pushes must name a tag ref"
              exit 1
            }
            TAG="${PUSH_REF#refs/tags/}"
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] || {
            echo "::error::invalid release tag: $TAG"
            exit 1
          }
          git check-ref-format "refs/tags/$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.validate.outputs.ref }}
          fetch-depth: 0

      - name: Record immutable revision
        id: commit
        env:
          RELEASE_TAG: ${{ steps.validate.outputs.tag }}
        run: |
          SHA=$(git rev-parse HEAD)
          TAG_SHA=$(git rev-list -n 1 "$RELEASE_TAG")
          [ "$TAG_SHA" = "$SHA" ] || {
            echo "::error::checked-out commit $SHA is not tag $RELEASE_TAG ($TAG_SHA)"
            exit 1
          }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  # ── Arch package ────────────────────────────────────────────────────────────
  arch:
    name: Arch package
    needs: resolve
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        # Deliberately the packages the PKGBUILD declares, not the `vlc`
        # metapackage: Arch splits VLC into libvlc (headers, libvlc.so) plus
        # separate plugin packages, and `vlc` lists the plugin sets as OPTIONAL
        # deps. Installing `vlc` gave a libvlc that loads and decodes nothing,
        # which is how tst_vlc_player timed out here while passing everywhere a
        # developer had vlc-plugins-all. Matching the declared depends means the
        # test proves the shipped dependency list is actually sufficient.
        run: |
          pacman -Syu --noconfirm --needed \
            git cmake ninja pkgconf gcc namcap ffmpeg \
            qt6-base qt6-declarative qt6-websockets qt6-tools qt6-svg mpv sdl3 \
            libvlc vlc-plugins-base vlc-plugin-ffmpeg

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0   # the PKGBUILD clones this checkout by tag

      # makepkg refuses to run as root, and a container has no other user.
      - name: Create build user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          # The chown above hands the checkout to builder, so git running as
          # root now refuses it as "dubious ownership" and exits 128. Harmless
          # until the version-consistency step below started calling git to
          # catch a moved tag; that turned the next release into a hard failure.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          # Arch's stock makepkg.conf splits out a -debug package. We do not
          # ship one, and its build-id symlinks point into the main package,
          # which namcap correctly reports as broken symlinks. OPTIONS is a
          # makepkg.conf array, not a command-line flag, so it is set here.
          sed -i 's/^OPTIONS=(\(.*\)debug/OPTIONS=(\1!debug/' /etc/makepkg.conf
          grep '^OPTIONS=' /etc/makepkg.conf

      # Three green package jobs once produced a release whose Arch package was
      # built from the PREVIOUS tag and named after it, because _tag is written
      # by hand and nothing compared it to the tag being released. Checked here
      # rather than trusted.
      - name: Version consistency
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          TAG="$RELEASE_TAG"
          TAG_SHA=$(git rev-list -n 1 "$TAG")
          [ "$TAG_SHA" = "$RELEASE_SHA" ] || {
            echo "::error::tag $TAG moved from $RELEASE_SHA to $TAG_SHA"
            exit 1
          }
          PKG_TAG=$(sed -n 's/^_tag=//p' packaging/arch/PKGBUILD)
          CM_VER=$(sed -n 's/^project(StrmQt VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "release tag=$TAG  PKGBUILD _tag=$PKG_TAG  CMake version=$CM_VER"
          [ "$PKG_TAG" = "$TAG" ] || {
            echo "::error::PKGBUILD _tag ($PKG_TAG) does not match the tag being released ($TAG)"
            exit 1
          }
          # The tag may carry a prerelease suffix the project version does not.
          case "$TAG" in
            "v$CM_VER"|"v$CM_VER"-*) ;;
            *) echo "::error::tag $TAG does not match CMake version $CM_VER"; exit 1 ;;
          esac

      - name: makepkg
        run: |
          cd packaging/arch
          # Arch's stock makepkg.conf splits out a -debug package. We do not
          # ship one, and its build-id symlinks legitimately point at the main
          # package, which namcap reports as errors. Build only what we ship.
          sudo -u builder makepkg -f --noconfirm
          PKG=$(ls strmqt-*.pkg.tar.zst | grep -v -- '-debug-' | head -1)
          echo "checking $PKG"
          sudo -u builder namcap "$PKG" | tee namcap.log
          # A namcap ERROR is a genuine packaging defect — a missing dependency
          # installs cleanly and then fails to start, which is what happened
          # with qt6-websockets. Warnings are advisory.
          if grep " E: " namcap.log; then
            echo "::error::namcap reported errors"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packaging/arch/strmqt-[0-9]*.pkg.tar.zst

  # ── AppImage ────────────────────────────────────────────────────────────────
  appimage:
    name: AppImage
    needs: resolve
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git cmake ninja pkgconf gcc patchelf fuse2 wget \
            qt6-base qt6-declarative qt6-websockets qt6-tools qt6-svg mpv sdl3

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Fetch appimagetool
        run: |
          wget -q -O /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /usr/local/bin/appimagetool" \
            | sha256sum --check --strict
          chmod +x /usr/local/bin/appimagetool

      - name: Build
        # appimagetool needs FUSE, which a container usually lacks; extracting
        # and running the tool directly is the documented way around it.
        run: APPIMAGE_EXTRACT_AND_RUN=1 ./packaging/appimage/build-appimage.sh

      # A successful build proves the compiler was happy, not that the packaged
      # QML module resolves inside the bundle. This is the check that does.
      - name: Self-test from inside the bundle
        env:
          STRMQT_SELFTEST: "1"
          QT_QPA_PLATFORM: offscreen
          QT_ASSUME_STDERR_HAS_CONSOLE: "1"
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 ./build/dist/StrmQt-*-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: build/dist/*.AppImage

  # ── Flatpak ─────────────────────────────────────────────────────────────────
  flatpak:
    name: Flatpak
    needs: resolve
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:kde-6.7
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ca.mikesdev.StrmQt.flatpak
          manifest-path: packaging/flatpak/ca.mikesdev.StrmQt.yml
          cache-key: flatpak-builder-${{ needs.resolve.outputs.sha }}

  # ── Publish ─────────────────────────────────────────────────────────────────
  release:
    name: Publish release
    needs: [resolve, arch, appimage, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Verify tag still names the built revision
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          TAG_SHA=$(git rev-list -n 1 "$RELEASE_TAG")
          [ "$TAG_SHA" = "$RELEASE_SHA" ] || {
            echo "::error::tag $RELEASE_TAG moved from $RELEASE_SHA to $TAG_SHA"
            exit 1
          }

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          TAG="$RELEASE_TAG"
          cat > artifacts/release-provenance.txt <<EOF
          tag=$RELEASE_TAG
          commit=$RELEASE_SHA
          appimagetool_url=https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          appimagetool_sha256=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          EOF
          find artifacts -type f | sort
          # A tag carrying a prerelease suffix (v0.3.0-rc1, -beta2, -alpha) is
          # marked as one. Without this it publishes looking like a final
          # release, and the "Latest" badge would move to it.
          PRERELEASE=""
          case "$TAG" in
            *-rc*|*-alpha*|*-beta*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "StrmQt $TAG" \
            --generate-notes \
            --draft $PRERELEASE \
            $(find artifacts -type f \( -name '*.pkg.tar.zst' -o -name '*.AppImage' -o -name '*.flatpak' -o -name 'release-provenance.txt' \) | tr '\n' ' ')
