name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  # ── Arch package ────────────────────────────────────────────────────────────
  arch:
    name: Arch package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git cmake ninja pkgconf gcc namcap \
            qt6-base qt6-declarative qt6-websockets qt6-tools mpv vlc sdl3

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the PKGBUILD clones this checkout by tag

      # makepkg refuses to run as root, and a container has no other user.
      - name: Create build user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: makepkg
        run: |
          cd packaging/arch
          sudo -u builder makepkg -f --noconfirm
          sudo -u builder namcap ./*.pkg.tar.zst | tee namcap.log
          # A namcap ERROR is a genuine packaging defect — a missing dependency
          # installs cleanly and then fails to start. Warnings are advisory.
          if grep " E: " namcap.log; then
            echo "::error::namcap reported errors"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packaging/arch/*.pkg.tar.zst

  # ── AppImage ────────────────────────────────────────────────────────────────
  appimage:
    name: AppImage
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git cmake ninja pkgconf gcc patchelf fuse2 wget \
            qt6-base qt6-declarative qt6-websockets qt6-tools mpv sdl3

      - uses: actions/checkout@v4

      - name: Fetch appimagetool
        run: |
          wget -q -O /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool

      - name: Build
        # appimagetool needs FUSE, which a container usually lacks; extracting
        # and running the tool directly is the documented way around it.
        run: APPIMAGE_EXTRACT_AND_RUN=1 ./packaging/appimage/build-appimage.sh

      # A successful build proves the compiler was happy, not that the packaged
      # QML module resolves inside the bundle. This is the check that does.
      - name: Self-test from inside the bundle
        env:
          STRMQT_SELFTEST: "1"
          QT_QPA_PLATFORM: offscreen
          QT_ASSUME_STDERR_HAS_CONSOLE: "1"
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 ./build/dist/StrmQt-*-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: build/dist/*.AppImage

  # ── Flatpak ─────────────────────────────────────────────────────────────────
  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:kde-6.7
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ca.mikesdev.StrmQt.flatpak
          manifest-path: packaging/flatpak/ca.mikesdev.StrmQt.yml
          cache-key: flatpak-builder-${{ github.sha }}

  # ── Publish ─────────────────────────────────────────────────────────────────
  release:
    name: Publish release
    needs: [arch, appimage, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          find artifacts -type f | sort
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "StrmQt $TAG" \
            --generate-notes \
            --draft \
            $(find artifacts -type f \( -name '*.pkg.tar.zst' -o -name '*.AppImage' -o -name '*.flatpak' \) | tr '\n' ' ')
